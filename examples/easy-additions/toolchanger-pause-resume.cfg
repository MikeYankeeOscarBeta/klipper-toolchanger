[gcode_macro RESUME]
rename_existing: BASE_RESUME_2
gcode:
    {% set tn = "T"+(tool.tool_number|string) %}
    {% set saved_extruder_temperature_target = printer["gcode_macro "+tn].saved_extruder_temperature_target|int %}
    {% if printer['pause_resume'].is_paused|int == 1 %}
        M109 T={tn} S={saved_extruder_temperature_target} ## set a temp and wait for tool to heat up
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            BASE_RESUME_2 ## resume print
            CHECK_ALL_FANS
        {% else %}
            RESPOND TYPE=error MSG='ERROR: Failed to heat tool to print temp'
        {% endif %}
    {% endif %}